# Feedback build for your pushes. It has no secrets and does not decide your result:
# the final evaluation runs separately on the exact commit you submit.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Docker build
        run: docker build -t candidate-app .
