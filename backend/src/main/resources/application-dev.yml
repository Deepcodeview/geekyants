spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:assessment;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
  cache:
    type: ${CACHE_TYPE:none}
  kafka:
    enabled: ${KAFKA_ENABLED:false}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  security:
    dev-jwt-secret: ${APP_DEV_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}

logging:
  level:
    com.geekyants.assessment: DEBUG

