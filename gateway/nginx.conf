# Enterprise API Gateway & Load Balancer Configuration
# Handles traffic routing, rate limiting, gzip compression, and upstream load balancing.

upstream backend_cluster {
    server host.docker.internal:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}



# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_gateway_limit:10m rate=150r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

server {
    listen 80;
    server_name localhost _;

    # Client body and buffer tuning for file submissions
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gateway Health Check
    location /gateway/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"AntFabric-API-Gateway","version":"1.0.0"}';
    }

    # Auth Rate Limiting (/dev/tokens)
    location /dev/tokens {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator & Telemetry Health
    location /actuator/ {
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API Routes (/api/)
    location /api/ {
        limit_req zone=api_gateway_limit burst=40 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # API Gateway Root Landing
    location / {
        default_type application/json;
        return 200 '{"platform":"AI Customized Project Assessment Platform","status":"UP","gateway":"AntFabric-API-Gateway","endpoints":{"api":"/api/v1/","health":"/actuator/health","tokens":"/dev/tokens"}}';
    }
}
