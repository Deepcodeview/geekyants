# Enterprise Production-Grade Multi-Service Architecture
# Includes: MySQL 8.4, Redis 7, Apache Kafka (KRaft), Backend Cluster, Frontend, and Nginx API Gateway Load Balancer.

services:
  # 1. Relational Database: MySQL 8.4 Server
  mysql:
    image: mysql:8.4
    container_name: assessment-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: assessment
      MYSQL_USER: assessment
      MYSQL_PASSWORD: assessment
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 2. In-Memory Distributed Cache & Rate Limiter: Redis 7
  redis:
    image: redis:7-alpine
    container_name: assessment-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. Distributed Event Streaming Broker: Apache Kafka (KRaft Mode - No Zookeeper Needed)
  kafka:
    image: apache/kafka:3.7.0
    container_name: assessment-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 4. Core Microservice Backend: Spring Boot 4 / Java 21
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assessment-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/assessment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: assessment
      DB_PASSWORD: assessment
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: redis
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ORG: ${GITHUB_ORG:-assessment-platform}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-webhook-secret}
      EVALUATION_CALLBACK_SECRET: ${EVALUATION_CALLBACK_SECRET:-callback-secret}
    expose:
      - "8080"

  # 6. Enterprise API Gateway & Load Balancer: Nginx Reverse Proxy
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: assessment-gateway
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  mysql-data:
  redis-data:
  kafka-data:
